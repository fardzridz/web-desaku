name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply local D1 migrations (build-time data)
        run: npx wrangler d1 migrations apply desaku-db --local && npx wrangler d1 execute desaku-db --local --file=db/seed.sql

      - name: Build (OpenNext Cloudflare)
        run: npx opennextjs-cloudflare build

      - name: Deploy (OpenNext Cloudflare)
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ce00e6ead1ba8d89965409f098181a86
